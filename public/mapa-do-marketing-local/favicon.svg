<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fundo azul marinho com bordas arredondadas -->
  <rect width="100" height="100" rx="22" fill="#0F172A"/>

  <!-- Sombra sutil do pin -->
  <ellipse cx="50" cy="82" rx="14" ry="5" fill="#000000" opacity="0.25"/>

  <!-- Corpo do pin de localização (laranja) -->
  <path d="M 50 14
           C 33 14, 20 27, 20 43
           C 20 58, 38 74, 50 84
           C 62 74, 80 58, 80 43
           C 80 27, 67 14, 50 14 Z"
        fill="#F97316"/>

  <!-- Círculo interno branco (buraco do pin) -->
  <circle cx="50" cy="43" r="14" fill="#0F172A"/>

  <!-- Ponto laranja central -->
  <circle cx="50" cy="43" r="6" fill="#F97316"/>
</svg>
